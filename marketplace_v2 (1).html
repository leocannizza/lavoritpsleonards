<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Negozio Online</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f0f0f0; }
    h1 { text-align: center; color: #333; }
    #sezioneUpload { text-align: center; margin: 20px; padding: 20px; background: white; border: 2px dashed #aaa; }
    #griglia { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 20px; }
    .card { background: white; border: 1px solid #ccc; padding: 16px; width: 200px; border-radius: 8px; }
    .card h3 { margin: 0 0 8px 0; font-size: 1rem; }
    .card p { margin: 4px 0; font-size: 0.85rem; color: #555; }
    .card .prezzo { font-size: 1.1rem; font-weight: bold; color: #c0392b; }
    .card button { margin-top: 10px; padding: 8px 14px; background: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
    .card button:hover { background: #e74c3c; }
    #carrello { margin-top: 30px; background: white; padding: 16px; border: 1px solid #ccc; border-radius: 8px; }
    #carrello h2 { margin-top: 0; }
    #listaCarrello li { padding: 4px 0; }
    #btnAcquista { margin-top: 10px; padding: 10px 20px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    #btnAcquista:hover { background: #1e8449; }
    #formAnagrafica { display: none; margin-top: 30px; background: white; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
    #formAnagrafica h2 { margin-top: 0; }
    #formAnagrafica label { display: block; margin-top: 10px; font-weight: bold; }
    #formAnagrafica input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    #btnConferma { margin-top: 16px; padding: 10px 20px; background: #2980b9; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    #messaggio { margin-top: 20px; padding: 16px; background: #d5f5e3; border: 1px solid #27ae60; border-radius: 8px; display: none; }
  </style>
</head>
<body>

<h1>🛒 Negozio Online</h1>

<!-- 1) CARICA CSV -->
<div id="sezioneUpload">
  <p><strong>Carica il file CSV dei prodotti:</strong></p>
  <input type="file" id="csvInput" accept=".csv">
</div>

<!-- 2) GRIGLIA PRODOTTI -->
<div id="griglia"></div>

<!-- 3) CARRELLO -->
<div id="carrello" style="display:none">
  <h2>🛒 Carrello</h2>
  <ul id="listaCarrello"></ul>
  <p><strong>Totale: € <span id="totale">0.00</span></strong></p>
  <button id="btnAcquista" onclick="mostraForm()">Procedi all'acquisto</button>
</div>

<!-- 4) FORM ANAGRAFICA -->
<div id="formAnagrafica">
  <h2>👤 I tuoi dati</h2>
  <label>Nome:</label>
  <input type="text" id="nome" placeholder="Mario">
  <label>Cognome:</label>
  <input type="text" id="cognome" placeholder="Rossi">
  <label>Email:</label>
  <input type="email" id="email" placeholder="mario@email.it">
  <label>Indirizzo:</label>
  <input type="text" id="indirizzo" placeholder="Via Roma 1, Genova">
  <br>
  <button id="btnConferma" onclick="confermOrdine()">✅ Conferma ordine</button>
</div>

<!-- 5) MESSAGGIO CONFERMA -->
<div id="messaggio">
  <p id="testoMessaggio"></p>
  <button onclick="scaricaPDF()" style="padding:8px 16px; background:#2980b9; color:white; border:none; border-radius:4px; cursor:pointer;">
    📄 Scarica ricevuta PDF
  </button>
</div>

<script>
  let carrello = [];

  // Lettura CSV
  document.getElementById('csvInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = function(ev) {
      const righe = ev.target.result.trim().split('\n');
      const intestazione = righe[0].split(',');
      const prodotti = [];
      for (let i = 1; i < righe.length; i++) {
        const valori = righe[i].split(',');
        const obj = {};
        intestazione.forEach((col, idx) => obj[col.trim()] = (valori[idx] || '').trim());
        prodotti.push(obj);
      }
      mostraProdotti(prodotti);
    };
    reader.readAsText(file);
  });

  // Mostra le card dinamicamente dal CSV
  function mostraProdotti(prodotti) {
    const griglia = document.getElementById('griglia');
    griglia.innerHTML = '';
    prodotti.forEach(p => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h3>${p.titolo}</h3>
        <p><em>${p.categoria}</em></p>
        <p>${p.descrizione}</p>
        <p>${p.dettaglio1 || ''}</p>
        <p>${p.dettaglio2 || ''}</p>
        <p class="prezzo">€ ${parseFloat(p.prezzo).toFixed(2)}</p>
        <button onclick='aggiungiCarrello(${JSON.stringify(p)})'>🛒 Aggiungi</button>
      `;
      griglia.appendChild(card);
    });
  }

  // Aggiungi al carrello
  function aggiungiCarrello(prodotto) {
    carrello.push(prodotto);
    aggiornaCarrello();
    document.getElementById('carrello').style.display = 'block';
  }

  function aggiornaCarrello() {
    const lista = document.getElementById('listaCarrello');
    lista.innerHTML = '';
    let totale = 0;
    carrello.forEach(p => {
      const li = document.createElement('li');
      li.textContent = p.titolo + ' — € ' + parseFloat(p.prezzo).toFixed(2);
      lista.appendChild(li);
      totale += parseFloat(p.prezzo);
    });
    document.getElementById('totale').textContent = totale.toFixed(2);
  }

  // Mostra form anagrafica
  function mostraForm() {
    if (carrello.length === 0) { alert('Il carrello è vuoto!'); return; }
    document.getElementById('formAnagrafica').style.display = 'block';
    document.getElementById('formAnagrafica').scrollIntoView({ behavior: 'smooth' });
  }

  // Conferma ordine
  function confermOrdine() {
    const nome = document.getElementById('nome').value;
    const cognome = document.getElementById('cognome').value;
    const email = document.getElementById('email').value;
    const indirizzo = document.getElementById('indirizzo').value;
    if (!nome || !cognome || !email || !indirizzo) { alert('Compila tutti i campi!'); return; }
    document.getElementById('testoMessaggio').textContent =
      'Grazie ' + nome + ' ' + cognome + '! Ordine ricevuto. Ti contatteremo a: ' + email;
    document.getElementById('messaggio').style.display = 'block';
    document.getElementById('messaggio').scrollIntoView({ behavior: 'smooth' });
  }

  // Genera PDF con jsPDF
  function scaricaPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const nome = document.getElementById('nome').value;
    const cognome = document.getElementById('cognome').value;
    const email = document.getElementById('email').value;
    const indirizzo = document.getElementById('indirizzo').value;

    doc.setFontSize(18);
    doc.text('Ricevuta di Acquisto', 20, 20);
    doc.setFontSize(12);
    doc.text('--- Dati Acquirente ---', 20, 35);
    doc.text('Nome: ' + nome + ' ' + cognome, 20, 45);
    doc.text('Email: ' + email, 20, 53);
    doc.text('Indirizzo: ' + indirizzo, 20, 61);
    doc.text('--- Prodotti Acquistati ---', 20, 75);
    let y = 85;
    let totale = 0;
    carrello.forEach(p => {
      doc.text('- ' + p.titolo + '  € ' + parseFloat(p.prezzo).toFixed(2), 20, y);
      y += 10;
      totale += parseFloat(p.prezzo);
    });
    doc.text('TOTALE: € ' + totale.toFixed(2), 20, y + 5);
    doc.text('Data: ' + new Date().toLocaleDateString('it-IT'), 20, y + 15);
    doc.save('ricevuta.pdf');
  }
</script>

</body>
</html>
