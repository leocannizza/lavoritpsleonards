<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<title>Anagrafica</title>
</head>

<body>

<h2>Inserisci i dati</h2>

<label>Nome</label>
<input type="text" id="name"><br><br>

<label>Cognome</label>
<input type="text" id="surname"><br><br>

<label>Indirizzo</label>
<input type="text" id="address"><br><br>

<label>Username</label>
<input type="text" id="username"><br><br>

<label>Email</label>
<input type="text" id="mail"><br><br>

<label>Città</label>
<input type="text" id="city"><br><br>

<label>CAP</label>
<input type="text" id="postal-code"><br><br>

<label>Data di nascita</label>
<input type="date" id="DOB"><br><br>

<label>Sesso</label><br>
<input type="radio" name="sesso" value="Maschio">Maschio
<input type="radio" name="sesso" value="Femmina">Femmina
<input type="radio" name="sesso" value="Altro">Altro
<br><br>

<label>Provincia</label>

<select id="prov">
<option value="MI">Milano</option>
<option value="RM">Roma</option>
<option value="TO">Torino</option>
<option value="NA">Napoli</option>
</select>

<br><br>

<label>Mezzi posseduti</label><br>

<input type="checkbox" name="locomozione" value="Auto">Auto
<input type="checkbox" name="locomozione" value="Moto">Moto
<input type="checkbox" name="locomozione" value="Barca">Barca
<input type="checkbox" name="locomozione" value="Aereo">Aereo

<br><br>

<label>Materia preferita</label>

<select id="materie">
<option value="Matematica">Matematica</option>
<option value="Italiano">Italiano</option>
<option value="Inglese">Inglese</option>
<option value="Informatica">Informatica</option>
</select>

<br><br>

<button onclick="creaAnagrafica()">Invia</button>

<hr>

<h2>Anagrafica</h2>

<p id="nameO"></p>
<p id="surnameO"></p>
<p id="addressO"></p>
<p id="usernameO"></p>
<p id="mailO"></p>
<p id="cityO"></p>
<p id="postal-codeO"></p>
<p id="DOBO"></p>
<p id="sessoO"></p>
<p id="provO"></p>
<p id="locomozioneO"></p>
<p id="materieO"></p>

<script src="script.js"></script>

</body>
</html>
