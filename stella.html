<html>
  <body>
    <canvas
      id="myCanvas"
      width="300"
      height="200"
      style="border:1px solid black"
    ></canvas>

    <script>
      const canvas = document.getElementById("myCanvas");
      const ctx = canvas.getContext("2d");

      ctx.beginPath();
      ctx.moveTo(150, 20);
      ctx.lineTo(197, 164);
      ctx.lineTo(74, 76);
      ctx.lineTo(226, 76);
      ctx.lineTo(103, 164);
      ctx.closePath();

      ctx.fillStyle = "yellow";
      ctx.strokeStyle = "blue";
      ctx.lineWidth = 3;

      ctx.fill();
      ctx.stroke();
    </script>
  </body>
</html>
