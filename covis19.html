
<!DOCTYPE html>
<html>
<body>

<h2>Dati COVID</h2>

<table border="1">
    <tr>
        <th>Data</th>
        <th>Ricoverati</th>
        <th>Terapia intensiva</th>
    </tr>
    <tbody id="tabella"></tbody>
</table>

<script>
let url = "https://raw.githubusercontent.com/pcm-dpc/COVID-19/master/dati-json/dpc-covid19-ita-andamento-nazionale.json";

fetch(url)
.then(r => r.json())
.then(dati => {
    dati.forEach(riga => {
        document.getElementById("tabella").innerHTML +=
        "<tr><td>" + riga.data.split("T")[0] +
        "</td><td>" + riga.ricoverati_con_sintomi +
        "</td><td>" + riga.terapia_intensiva + "</td></tr>";
    });
});
</script>

</body>
</html>
