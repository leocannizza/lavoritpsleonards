<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,
initial-scale=1.0">
<title>Form Anagrafica Utente</title>
<style>
body {
font-family: Arial, sans-serif;
margin: 20px;
background-color: #f4f4f9;
}
.container {
max-width: 600px;
margin: 0 auto;
padding: 20px;
background-color: #fff;
box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}
h2 {
text-align: center;
}
label {
display: block;
margin: 10px 0 5px;
}
input[type="text"], input[type="number"], input[type="date"] {
width: 100%;
padding: 8px;
margin-bottom: 15px;
border: 1px solid #ccc;
border-radius: 4px;
}
input[type="submit"] {
background-color: #4CAF50;
color: white;
border: none;
padding: 10px 20px;
cursor: pointer;
border-radius: 4px;
width: 100%;
}

input[type="submit"]:hover {
background-color: #45a049;
}
.result {
margin-top: 20px;
padding: 10px;
background-color: #e8f5e9;
border: 1px solid #4CAF50;
border-radius: 4px;
}
</style>
</head>
<body>
<div class="container">
<h2>Inserisci i Dati Anagrafici</h2>
<form id="user-form">
<label for="nome">Nome:</label>
<input type="text" id="nome" name="nome" required>
<label for="cognome">Cognome:</label>
<input type="text" id="cognome" name="cognome" required>
<label for="indirizzo">Indirizzo:</label>
<input type="text" id="indirizzo" name="indirizzo" required>
<label for="citta">Città:</label>
<input type="text" id="citta" name="citta" required>
<label for="cap">CAP:</label>
<input type="number" id="cap" name="cap" required>
<label for="eta">Età:</label>
<input type="number" id="eta" name="eta" required>
<label for="data-nascita">Data di Nascita:</label>
<input type="date" id="data-nascita" name="data-nascita"
required>
<input type="submit" value="Invia">
</form>
<div class="result" id="generation-result" style="display: none;">

<h3>Generazione di appartenenza:</h3>
<p id="generation"></p>
</div>
</div>
<script>
document.getElementById('user-form').addEventListener('submit',
function(e) {
e.preventDefault();
var nome = document.getElementById('nome').value;
var cognome = document.getElementById('cognome').value;
var annoNascita = new
Date(document.getElementById('data-nascita').value).getFullYear();
var generazione = '';
switch (true) {
case annoNascita >= 2013:
generazione = 'generazione alfa (2013 - oggi)';
break;
case annoNascita >= 1997:
generazione = 'generazione z (1997 - 2012)';
break;
case annoNascita >= 1981:
generazione = 'millennials (1981 - 1996)';
break;
case annoNascita >= 1965:
generazione = 'generazione x (1965 - 1980)';
break;
case annoNascita >= 1946:
generazione = 'baby boomers (1946 - 1964)';
break;
case annoNascita >= 1928:
generazione = 'generazione silenziosa (1928 - 1945)';
break;
case annoNascita >= 1901:
generazione = 'generazione più grande (1901 - 1927)';
break;
default:
generazione = 'anno di nascita non valido';
}

var resultDiv = document.getElementById('generation-result');
resultDiv.style.display = 'block';
document.getElementById('generation').textContent = nome + ' ' +
cognome + ' appartiene alla ' + generazione;
});
</script>

</body>
</html>
